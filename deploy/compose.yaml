services:
  php:
    build:
      context: ../server
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - secretbox-data:/var/lib/secretbox

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SECRETBOX_DOMAIN: ${SECRETBOX_DOMAIN:-:8080}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../server/public:/var/www/html/public:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - php

volumes:
  secretbox-data:
  caddy-data:
  caddy-config:

