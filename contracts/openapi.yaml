openapi: 3.1.0
info:
  title: secret-box API
  version: 1.2.0
  description: Opaque storage API for age-encrypted ciphertext.
servers:
  - url: https://secretbox.example.com
paths:
  /:
    get:
      summary: Check basic configuration
      description: Returns a generic boolean indicating whether an upload token is configured.
      responses:
        '200':
          description: Configuration check
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /api/v1/transfers:
    get:
      summary: List publicly discoverable transfers
      description: Public, unauthenticated listing. Only explicitly listable, unexpired transfers with ciphertext are included. Original filenames remain encrypted. Ordered by ID, with at most 100 entries per page. Concurrent uploads may appear on a later traversal.
      security: []
      parameters:
        - name: after
          in: query
          description: Exclusive transfer ID cursor returned as next_cursor.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{32}$'
      responses:
        '200':
          description: A page of public transfer metadata
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [transfers, next_cursor]
                properties:
                  transfers:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Transfer'
                  next_cursor:
                    type: [string, 'null']
                    pattern: '^[A-Za-z0-9_-]{32}$'
        '400':
          description: Invalid listing cursor
        '500':
          description: Could not list transfers
    post:
      summary: Create a transfer
      description: Requires any active upload token. Tokens are managed and revoked through the server CLI.
      security:
        - uploadToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ciphertext]
              properties:
                ciphertext:
                  type: string
                  format: binary
                listable:
                  type: boolean
                  default: false
                  description: Send as the multipart text value true or false. True publishes the transfer ID, ciphertext size, and timestamps in the unauthenticated listing. Omitted means unlisted.
      responses:
        '201':
          description: Transfer stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: Invalid upload or listable field (must be true or false)
        '401':
          description: Upload token is missing, invalid, or revoked
        '413':
          description: Ciphertext exceeds the configured limit
        '429':
          description: Another upload is in progress; retry after the Retry-After delay
          headers:
            Retry-After:
              schema:
                type: integer
        '507':
          description: Total storage or transfer count quota exceeded
        '503':
          description: Server is not configured
  /api/v1/transfers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{32}$'
    get:
      summary: Download ciphertext
      responses:
        '200':
          description: age-encrypted file
          headers:
            Content-Length:
              schema:
                type: integer
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Transfer does not exist or has expired
    delete:
      summary: Delete a transfer
      description: Any active upload token may delete a transfer by ID, regardless of which device uploaded it.
      security:
        - uploadToken: []
      responses:
        '204':
          description: Transfer deleted
        '401':
          description: Upload token is missing, invalid, or revoked
        '503':
          description: Server has no usable token configuration
        '404':
          description: Transfer does not exist
components:
  securitySchemes:
    uploadToken:
      type: http
      scheme: bearer
      description: An active named upload token, or the legacy single token before migration.
  schemas:
    Transfer:
      type: object
      required: [id, size, created_at, expires_at, listable]
      properties:
        listable:
          type: boolean
          description: Whether this transfer is publicly discoverable. This does not change age encryption or download authorization by ID.
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{32}$'
        size:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

