[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-box-cli"
version = "0.1.0"
description = "CLI personal para enviar texto, archivos y carpetas cifrados"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sb = "secretbox.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

